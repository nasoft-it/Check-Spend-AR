```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Spend AR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .ar-text {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      font-size: clamp(32px, 9vw, 72px);
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 25px rgba(0,180,255,.8),
        0 0 50px rgba(0,180,255,.5);
      animation: float 3s ease-in-out infinite;
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 12px;
      font-size: clamp(14px, 4vw, 24px);
      font-weight: 500;
      letter-spacing: 1px;
      opacity: .9;
    }

    .start {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      padding: 15px 26px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.95);
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .hint {
      position: fixed;
      z-index: 4;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      font-size: 14px;
      opacity: .85;
      width: 90%;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0);
      }
      50% {
        transform: translate(-50%, -50%) translateY(-15px);
      }
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline muted></video>

  <div class="overlay">
    <div class="hint" id="hint">
      Point your camera at a clear surface
    </div>

    <div class="ar-text">
      CHECK SPEND
      <div class="subtitle">
        Track. Understand. Control.
      </div>
    </div>
  </div>

  <button class="start" id="start">
    Start AR
  </button>

  <script>
    const camera = document.getElementById("camera");
    const start = document.getElementById("start");
    const hint = document.getElementById("hint");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        camera.srcObject = stream;

        start.classList.add("hidden");
        hint.textContent = "Move your phone slowly to view the AR text";
      } catch (error) {
        hint.textContent =
          "Camera access was denied. Please allow camera access and reload.";
      }
    }

    start.addEventListener("click", startCamera);
  </script>

</body>
</html>
