<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Check Spend AR</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #start {
      position: fixed;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      z-index: 10;

      border: 0;
      border-radius: 999px;
      padding: 16px 28px;

      background: white;
      color: #111;

      font-size: 17px;
      font-weight: 700;

      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    #message {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 10;

      width: 90%;
      text-align: center;

      color: white;
      font-size: 16px;
      font-weight: 600;

      text-shadow: 0 2px 8px #000;
      pointer-events: none;
    }

    #reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: 55px;
      height: 55px;

      border: 2px solid white;
      border-radius: 50%;

      z-index: 5;
      display: none;

      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="message">
    Tap "Start AR" to begin
  </div>

  <div id="reticle"></div>

  <button id="start">
    Start AR
  </button>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    import { ARButton } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js";

    import { FontLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/FontLoader.js";

    import { TextGeometry } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/TextGeometry.js";


    // --------------------------------------------------
    // BASIC THREE.JS SETUP
    // --------------------------------------------------

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.xr.enabled = true;

    document.body.appendChild(renderer.domElement);


    // --------------------------------------------------
    // LIGHTING
    // --------------------------------------------------

    const ambientLight = new THREE.HemisphereLight(
      0xffffff,
      0xbbbbbb,
      3
    );

    scene.add(ambientLight);


    const directionalLight = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    directionalLight.position.set(
      2,
      4,
      2
    );

    scene.add(directionalLight);


    // --------------------------------------------------
    // UI
    // --------------------------------------------------

    const startButton = document.getElementById("start");
    const message = document.getElementById("message");
    const reticle = document.getElementById("reticle");


    // --------------------------------------------------
    // AR VARIABLES
    // --------------------------------------------------

    let controller;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let currentHitMatrix = null;

    let textObject = null;

    let font = null;


    // --------------------------------------------------
    // LOAD 3D FONT
    // --------------------------------------------------

    const fontLoader = new FontLoader();

    fontLoader.load(
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/fonts/helvetiker_bold.typeface.json",
      loadedFont => {

        font = loadedFont;

        message.textContent =
          "Ready — tap Start AR";

      },
      undefined,
      error => {

        console.error(error);

        message.textContent =
          "Could not load the 3D font.";

      }
    );


    // --------------------------------------------------
    // CREATE 3D CHECK SPEND TEXT
    // --------------------------------------------------

    function createText() {

      if (!font) return;

      if (textObject) {
        scene.remove(textObject);
      }


      const geometry = new TextGeometry(
        "CHECK SPEND",
        {
          font: font,

          size: 0.18,

          depth: 0.055,

          curveSegments: 12,

          bevelEnabled: true,

          bevelThickness: 0.012,

          bevelSize: 0.008,

          bevelSegments: 4
        }
      );


      geometry.computeBoundingBox();


      const centerOffset =
        -0.5 *
        (
          geometry.boundingBox.max.x -
          geometry.boundingBox.min.x
        );


      geometry.translate(
        centerOffset,
        0,
        0
      );


      // Front material
      const frontMaterial =
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          metalness: 0.25,
          roughness: 0.3
        });


      // Create actual 3D mesh
      textObject =
        new THREE.Mesh(
          geometry,
          frontMaterial
        );


      // Slightly above the detected surface
      textObject.position.y += 0.01;


      scene.add(textObject);


      // Small shadow-like base
      const baseGeometry =
        new THREE.BoxGeometry(
          1.7,
          0.01,
          0.35
        );


      const baseMaterial =
        new THREE.MeshStandardMaterial({
          color: 0x111111,
          transparent: true,
          opacity: 0.18
        });


      const base =
        new THREE.Mesh(
          baseGeometry,
          baseMaterial
        );


      base.position.set(
        0,
        -0.015,
        -0.02
      );


      textObject.add(base);


      message.textContent =
        "3D Check Spend placed — move around it!";

    }


    // --------------------------------------------------
    // AR BUTTON
    // --------------------------------------------------

    startButton.addEventListener(
      "click",
      async () => {

        if (!navigator.xr) {

          message.textContent =
            "WebXR AR isn't supported on this browser.";

          return;
        }


        const supported =
          await navigator.xr.isSessionSupported(
            "immersive-ar"
          );


        if (!supported) {

          message.textContent =
            "This phone/browser does not support AR.";

          return;
        }


        startButton.classList.add("hidden");


        const arButton =
          ARButton.createButton(
            renderer,
            {
              requiredFeatures: [
                "hit-test"
              ],

              optionalFeatures: [
                "dom-overlay"
              ],

              domOverlay: {
                root: document.body
              }
            }
          );


        // Automatically click the real WebXR button
        arButton.click();

      }
    );


    // --------------------------------------------------
    // CONTROLLER
    // --------------------------------------------------

    controller =
      renderer.xr.getController(0);


    scene.add(controller);


    controller.addEventListener(
      "select",
      () => {

        // User tapped the screen
        // while AR is running.

        if (
          currentHitMatrix &&
          !textObject
        ) {

          createText();


          // Put the text at the detected surface
          textObject.matrix.fromArray(
            currentHitMatrix
          );

          textObject.matrix.decompose(
            textObject.position,
            textObject.quaternion,
            textObject.scale
          );

        }

      }
    );


    // --------------------------------------------------
    // WEBXR SESSION
    // --------------------------------------------------

    renderer.xr.addEventListener(
      "sessionstart",
      () => {

        message.textContent =
          "Move your phone slowly to find a surface.";

        reticle.style.display =
          "block";

      }
    );


    renderer.xr.addEventListener(
      "sessionend",
      () => {

        hitTestSource = null;
        hitTestSourceRequested = false;

        reticle.style.display =
          "none";

        message.textContent =
          "AR session ended.";

        startButton.classList.remove(
          "hidden"
        );

      }
    );


    // --------------------------------------------------
    // RESIZE
    // --------------------------------------------------

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    // --------------------------------------------------
    // AR RENDER LOOP
    // --------------------------------------------------

    renderer.setAnimationLoop(
      (timestamp, frame) => {

        if (frame) {

          const session =
            renderer.xr.getSession();


          const referenceSpace =
            renderer.xr.getReferenceSpace();


          // Request hit-test source
          if (
            !hitTestSourceRequested
          ) {

            session.requestReferenceSpace(
              "viewer"
            ).then(
              referenceSpace => {

                session.requestHitTestSource({
                  space: referenceSpace
                }).then(
                  source => {

                    hitTestSource =
                      source;

                  }
                );

              }
            );


            hitTestSourceRequested =
              true;


            session.addEventListener(
              "end",
              () => {

                hitTestSourceRequested =
                  false;

                hitTestSource =
                  null;

              }
            );

          }


          // Detect real-world surface
          if (hitTestSource) {

            const hitTestResults =
              frame.getHitTestResults(
                hitTestSource
              );


            if (
              hitTestResults.length > 0
            ) {

              const hit =
                hitTestResults[0];


              const pose =
                hit.getPose(
                  referenceSpace
                );


              if (pose) {

                currentHitMatrix =
                  pose.transform.matrix;


                // Show placement indicator
                reticle.style.display =
                  "block";


                if (!textObject) {

                  message.textContent =
                    "Surface found — TAP to place 3D text.";

                }

              }

            }

          }

        }


        renderer.render(
          scene,
          camera
        );

      }
    );

  </script>

</body>
</html>
